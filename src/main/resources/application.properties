# API Valdora · proyecto demostrativo — desarrollo propio, no asociado a un cliente real.
spring.application.name=showcase-api-springboot
server.port=${PORT:8081}

# H2 en memoria con datos ficticios (perfil "mysql" para MySQL, ver compose.yaml)
spring.datasource.url=jdbc:h2:mem:valdora-api;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Errores sin trazas internas
server.error.include-stacktrace=never
server.error.include-message=never

# Documentación OpenAPI y Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Solo el estado de salud queda expuesto
management.endpoints.web.exposure.include=health

# Datos de demostración al iniciar
app.datos-demo=true
