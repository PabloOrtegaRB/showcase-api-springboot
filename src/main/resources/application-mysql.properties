# Perfil MySQL: se activa con SPRING_PROFILES_ACTIVE=mysql (ver compose.yaml y .env.example).
# Las credenciales llegan por variables de entorno; nunca se escriben aquí.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:valdora}
spring.datasource.username=${DB_USER:valdora}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
